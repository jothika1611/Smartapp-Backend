spring:
  application:
    name: ${APP_NAME:smartpay}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/smartpay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:smartpay_app}
    password: ${DB_PASSWORD:CHANGE_ME_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SmartPayPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  ai:
    openai:
      api-key: ${AI_API_KEY:demo-only-placeholder}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: smartpay-event-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:5173}
  demo-admin:
    enabled: ${DEMO_ADMIN_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_USE_A_RANDOM_32_CHAR_MINIMUM_STRING}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:7}
    issuer: ${JWT_ISSUER:smartpay-demo}
  rate-limit:
    per-minute: ${RATE_LIMIT_PER_MINUTE:60}
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  security:
    revocation-cleanup-ms: ${REVOCATION_CLEANUP_MS:3600000}
  fraud:
    low-max: ${FRAUD_LOW_MAX:24}
    medium-max: ${FRAUD_MEDIUM_MAX:49}
    high-min: ${FRAUD_HIGH_MIN:50}
    min-distinct-rules-for-hold: ${FRAUD_MIN_DISTINCT_RULES_FOR_HOLD:2}
    amount-cap: ${FRAUD_AMOUNT_CAP:50000.00}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    topics:
      tx-created: ${KAFKA_TOPIC_TX_CREATED:smartpay.tx.created}
      tx-status: ${KAFKA_TOPIC_TX_STATUS:smartpay.tx.status.changed}
      notification: ${KAFKA_TOPIC_NOTIFICATION:smartpay.notification.event}
      dlq: ${KAFKA_TOPIC_DLQ:smartpay.dlq}
    outbox:
      max-attempts: ${KAFKA_OUTBOX_MAX_ATTEMPTS:5}
      retry-delay-ms: ${KAFKA_OUTBOX_RETRY_DELAY_MS:2000}
  redis:
    enabled: ${REDIS_ENABLED:false}
    velocity-ttl-seconds: ${REDIS_VELOCITY_TTL_SECONDS:30}
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:5}
